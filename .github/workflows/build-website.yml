name: Build Website and Meta Files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  merge_group:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - develop

jobs:
  build-metadata:
    name: Build Metadata Files
    uses: ./.github/workflows/update-meta.yml
    permissions:
      contents: write

  build-website:
    name: Build and Deploy Website
    needs: [build-metadata]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Checkout meta branch (read-only)
        uses: actions/checkout@v4
        with:
          ref: meta
          path: meta-branch

      - name: Integrate meta files
        run: |
          mkdir -p _site/v1
          if [ -d meta-branch/ptlauncher ] && [ "$(ls -A meta-branch/ptlauncher 2>/dev/null)" ]; then
            cp -r meta-branch/ptlauncher/* _site/v1/
            echo "Meta injected into v1/"
          else
            echo "WARNING: meta-branch/ptlauncher missing or empty, skipping"
          fi

      - name: Prepare deploy files
        run: |
          touch _site/.nojekyll
          if [ -f .github/CNAME ]; then
            cp .github/CNAME _site/CNAME
          fi

      - name: Deploy to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: deploy
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
