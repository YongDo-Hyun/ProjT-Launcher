name: Update ProjT Meta Files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: meta-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure git user
        run: |
          git config user.name "Project Tick Bot"
          git config user.email "github@bot.yongdohyun.org.tr"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install .

      - name: Run meta updater
        run: ./newupdate.sh

      - name: Commit & push if changed
        run: |
          if git status --porcelain meta/ | grep .; then
            git add meta/
            git commit -m "meta: automated update"
            git push
          else
            echo "No meta changes"
          fi
        