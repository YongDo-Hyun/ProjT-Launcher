name: Update ProjT Meta Files

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: meta-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta

      - name: Free disk space (GitHub-hosted runners)
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h
  
          # Free up space on GitHub-hosted runners (safe to ignore missing paths).
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO swapoff -a || true
          $SUDO rm -rf /swapfile || true

          $SUDO rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true
          $SUDO rm -rf /usr/local/share/boost /usr/local/share/powershell || true
  
          $SUDO apt-get clean || true
          $SUDO rm -rf /var/lib/apt/lists/* || true
  
          echo "Disk usage after cleanup:"
          df -h

      - name: Configure git user
        run: |
          git config user.name "YongDo-Hyun"
          git config user.email "froster12@naver.com"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install .

      - name: Run meta updater
        run: ./newupdate.sh
